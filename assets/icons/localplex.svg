  <rect x="112" y="104" width="36" height="24" rx="6" fill="#1f2430"/>
  <rect x="172" y="104" width="36" height="24" rx="6" fill="#1f2430"/>
  <rect x="238" y="104" width="36" height="24" rx="6" fill="#1f2430"/>
  <rect x="304" y="104" width="36" height="24" rx="6" fill="#1f2430"/>
  <rect x="364" y="104" width="36" height="24" rx="6" fill="#1f2430"/>

  <!-- Cinematic Frame Perforations Bottom -->
  <rect x="112" y="384" width="36" height="24" rx="6" fill="#1f2430"/>
  <rect x="172" y="384" width="36" height="24" rx="6" fill="#1f2430"/>
  <rect x="238" y="384" width="36" height="24" rx="6" fill="#1f2430"/>
  <rect x="304" y="384" width="36" height="24" rx="6" fill="#1f2430"/>
  <rect x="364" y="384" width="36" height="24" rx="6" fill="#1f2430"/>

  <!-- Center Screen Plate -->
  <rect x="112" y="152" width="288" height="208" rx="16" fill="#090a0d" stroke="#232733" stroke-width="2"/>

